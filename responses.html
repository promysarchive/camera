<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESPONSES</title>

<style>

body{
    background:black;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
}

.page{
    display:flex;
    align-items:flex-start;
    gap:120px;
    padding:90px 40px;
}

.logo{
    text-decoration:none;
    color:white;
    font-size:120px;
    font-weight:900;
    line-height:0.82;
    transform:scaleX(1.3);
}

.content{
    max-width:700px;
}

.label{
    font-size:14px;
    letter-spacing:3px;
    margin-bottom:30px;
}
    
#responses{
    display:flex;
    flex-direction:column;
    gap:20px;
    margin-top:40px;
}

.response-card{
    border:1px solid white;
    padding:20px;
    max-width:700px;
    font-size:18px;
    line-height:1.5;
}

</style>
</head>

<body>

<div class="page">

<a href="/" class="logo">
P<br>
R<br>
O<br>
M<br>
Y<br>
S
</a>

<div class="content">

<div class="label">
RESPONSES
</div>

<div id="responses">
</div>

</div>

</div>
<script>
const SUPABASE_URL = "https://pqrkpoqjblmeuumislmm.supabase.co";
const SUPABASE_KEY = "sb_publishable_5cGSJMAF1nqCUG97Yuupeg_dY-Buf9k";

async function loadResponses() {

    const response = await fetch(
        `${SUPABASE_URL}/rest/v1/responses?approved=eq.true&select=*`,
        {
            headers: {
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`
            }
        }
    );

    const data = await response.json();
    console.log(data);

    const container = document.getElementById("responses");

    container.innerHTML = data.map(item => `
        <div class="response-card">
            ${item.answer}
        </div>
    `).join("");
}

loadResponses();
</script>
</body>
</html>
