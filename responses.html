<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESPONSES</title>

<style>

body{
    background:black;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
}
/* TOP NAVIGATION */
.topbar {
    height: 65px;
    width: 100%;
    padding: 0 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    box-sizing: border-box;
}

.brand {
    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 1px;
}

.top-links {
    display: flex;
    align-items: center;
    gap: 28px;
}

.top-links a {
    color: white;
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 1px;
    transition: opacity 0.2s ease;
}

.top-links a:hover {
    opacity: 0.5;
}

@media (max-width: 650px) {
    .topbar {
        height: auto;
        min-height: 65px;
        padding: 18px;
        gap: 20px;
    }

    .top-links {
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 12px 16px;
    }

    .top-links a {
        font-size: 9px;
    }

    .brand {
        font-size: 16px;
    }
}

.page{
    display:flex;
    align-items:flex-start;
    gap:120px;
    padding:60px 40px;
}

.logo{
    text-decoration:none;
    color:white;
    font-size:120px;
    font-weight:900;
    line-height:0.82;
    transform:scaleX(1.3);
}

.content{
    max-width:700px;
}

.label{
    letter-spacing:3px;
    font-size:48px;
    font-weight:900;
    margin-bottom:40px;
}
    
#responses{
    display:flex;
    flex-direction:column;
    gap:20px;
    margin-top:40px;
}

.response-card{
    border:1px solid #333;
    padding:25px;
    max-width:700px;
    font-size:22px;
    line-height:1.6;
    background:#050505;
}

.response-card:hover{
    border-color:white;
}

</style>
</head>

<body>
<header class="topbar">
    <a href="index.html" class="brand">PROMYS</a>

    <nav class="top-links">
        <a href="index.html">HOME</a>
        <a href="archive.html">ARCHIVE</a>
        <a href="photobooth.html">PHOTOBOOTH</a>
        <a href="unsaid.html">UNSAID</a>
    </nav>
</header>

<div class="page">



<div class="content">

<div class="label">
What People Said...
</div>

<div id="responses">
</div>

</div>

</div>
<script>
const SUPABASE_URL = "https://pqrkpoqjblmeuumislmm.supabase.co";
const SUPABASE_KEY = "sb_publishable_5cGSJMAF1nqCUG97Yuupeg_dY-Buf9k";

async function loadResponses() {

    const response = await fetch(
        `${SUPABASE_URL}/rest/v1/responses?select=*`,
        {
            headers: {
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`
            }
        }
    );

    const data = await response.json();
    console.log("STATUS:", response.status);
    console.log("DATA:", data);
    console.log(data);

    const container = document.getElementById("responses");

    container.innerHTML = data.map(item => `
        <div class="response-card">
            ${item.answer}
        </div>
    `).join("");
}

loadResponses();
</script>
</body>
</html>
