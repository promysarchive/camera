<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHOTO BOOTH</title>

<style>
video{
    width:60vw;
    max-width:600px;
}
body{
    background:black;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
}

.page{
    display:flex;
    align-items:center;
    gap:60px;
    padding:40px;
}

.logo{
    font-size:24px;
    letter-spacing:8px;
    line-height:40px;
}

.camera-section{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

.options{
    display:flex;
    flex-direction:column;
    gap:15px;
}

button{
    margin-top:20px;
background:none;
border:1px solid white;
color:white;
padding:12px 24px;
font-family:Arial,sans-serif;
letter-spacing:2px;
cursor:pointer;
}

button:hover{
background:white;
color:black;
}

.camera-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}
    
</style>

</head>
<body>

<div class="page">

    <div class="logo">
        P<br>
        R<br>
        O<br>
        M<br>
        Y<br>
        S
    </div>

    <div class="camera-section">
        <video id="camera" autoplay playsinline></video>
        <button id="snap">TAKE PHOTO</button>
    </div>

    <div class="options">
        <button>VERTICAL</button>
        <button>HORIZONTAL</button>

        <button>DOWNLOAD</button>
    </div>

</div>
<script>
navigator.mediaDevices.getUserMedia({ video: true })
.then(function(stream) {
    document.getElementById("camera").srcObject = stream;
})
.catch(function(error) {
    console.log(error);
});
</script>
</body>
</html>
