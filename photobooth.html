<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHOTO BOOTH</title>

<style>
video{
    width:70vw;
    max-width:700px;
    transform: scaleX(-1);
}
body{
    background:black;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
}

.page{
    display:flex;
    align-items:center;
    gap:80px;
    padding:90px 40px 40px 40px;
}

.logo{
text-decoration:none;
color:white;
font-size:120px;
font-weight:900;
line-height:0.82;
font-family: Arial, sans-serif;
transform: scaleX(1.3);
}

.camera-section{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;

    margin-top:30px;

    position:relative;
}

.options{
    display:flex;
    flex-direction:column;
    gap:15px;
}

#strip{
    background:white;
    padding:10px;
    display:none;
    flex-direction:column;
    gap:6px;
    width:180px;
    margin:40px auto;
}

#strip img{
    width:100%;
    display:block;
    border:2px solid white;
    box-sizing:border-box;
}

.camera-frame{
    position:relative;
    width: 100%;
    overflow: hidden;
    background: #171717;
    border: 1px solid #343434;
    border-radius: 18px;
    aspect-ratio: 4 / 3;
    box-shadow: 0 15px 55px #0008;
}

button{
    margin-top:20px;
background:none;
border:1px solid white;
color:white;
padding:12px 24px;
font-family:Arial,sans-serif;
letter-spacing:2px;
cursor:pointer;
}

button:hover{
background:white;
color:black;
}

.camera-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

#countdown{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:120px;
    font-weight:900;
    color:white;
    display:none;
}

.flash{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:white;
    opacity:0;
    pointer-events:none;
}

.branding{
    color:black;
    font-size:24px;
    font-weight:900;
    letter-spacing:6px;
    text-align:center;
    margin-top:10px;
    transform:scaleX(1.3);
}

.strip-section{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

.filter-options {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
}

.filter-btn {
    margin-top: 0;
    padding: 9px 12px;
    font-size: 10px;
    letter-spacing: 1px;
    border: 1px solid #555;
    color: #aaa;
}

.filter-btn.active {
    background: white;
    color: black;
    border-color: white;
}

.filter-btn:hover {
    background: white;
    color: black;
}

.camera-frame.y2k-grain::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.18;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
    mix-blend-mode: soft-light;
}
    
</style>

</head>
<body>

<div class="page">

    <a href="https://promysarchive.github.io/camera" class="logo">
        P<br>
        R<br>
        O<br>
        M<br>
        Y<br>
        S
    </a>

    <div class="camera-section">

    <div class="camera-frame">
        <video id="camera" autoplay playsinline></video>
        <div id="flash" class="flash"></div>
    </div>

    <div class="filter-options">
        <button class="filter-btn active" data-filter="original">♡ ORIGINAL</button>
        <button class="filter-btn" data-filter="y2k">♡ Y2K</button>
        <button class="filter-btn" data-filter="pink">♡ PINK</button>
        <button class="filter-btn" data-filter="black">♡ B&W</button>
    </div>

    <button id="snap">TAKE PHOTO</button>

</div>

<div class="strip-section">

    <div id="strip"></div>

    <button id="download">DOWNLOAD</button>

</div>

</div>

<div id="countdown"></div>

<canvas id="photo" style="display:none;"></canvas>
<canvas id="finalStrip" style="display:none;"></canvas>
    
<script>
    
navigator.mediaDevices.getUserMedia({ video: true })
.then(function(stream) {
    document.getElementById("camera").srcObject = stream;
})
.catch(function(error) {
    console.log(error);
});

let photos = [];
let finalImage = "";
    document.getElementById("download").addEventListener("click", function() {

    if (finalImage === "") {
        alert("Take photos first!");
        return;
    }

    const link = document.createElement("a");

    link.href = finalImage;
    link.download = "promys-photobooth.png";

    link.click();

});
    
document.getElementById("snap").addEventListener("click", function() {

    document.getElementById("countdown").style.display = "block";

    document.getElementById("countdown").textContent = "3";

    setTimeout(function() {
        document.getElementById("countdown").textContent = "2";
    }, 1000);

    setTimeout(function() {
        document.getElementById("countdown").textContent = "1";
    }, 2000);

   setTimeout(function() {

    document.getElementById("flash").style.opacity = "1";

    setTimeout(function() {
        document.getElementById("flash").style.opacity = "0";
    }, 150);

    const video = document.getElementById("camera");
const canvas = document.getElementById("photo");

canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

const context = canvas.getContext("2d");

context.save();
context.scale(-1, 1);

context.filter = filters[selectedFilter];

context.drawImage(
    video,
    -canvas.width,
    0,
    canvas.width,
    canvas.height
);

context.filter = "none";

context.restore();

photos.push(canvas.toDataURL("image/png"));

console.log("Photos taken:", photos.length);

if (photos.length < 4) {
    setTimeout(function() {
        document.getElementById("snap").click();
    }, 3000);
}

if (photos.length === 4) {
 
const finalCanvas = document.getElementById("finalStrip");
const finalContext = finalCanvas.getContext("2d");

finalCanvas.width = 300;
finalCanvas.height = 980;

finalContext.fillStyle = "white";
finalContext.fillRect(0, 0, finalCanvas.width, finalCanvas.height);

Promise.all(
    photos.map(photo => {
        return new Promise(resolve => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.src = photo;
        });
    })
).then(images => {

    finalContext.drawImage(images[0], 10, 10, 280, 210);
    finalContext.drawImage(images[1], 10, 240, 280, 210);
    finalContext.drawImage(images[2], 10, 470, 280, 210);
    finalContext.drawImage(images[3], 10, 700, 280, 210);

    finalContext.fillStyle = "black";
    finalContext.font = "bold 30px Arial";
    finalContext.textAlign = "center";

    finalContext.fillText(
        "PROMYS",
        finalCanvas.width / 2,
        940
    );

finalContext.fillStyle = "black";
finalContext.font = "bold 30px Arial";
finalContext.textAlign = "center";

finalContext.fillText(
    "PROMYS",
    finalCanvas.width / 2,
    1340
);

finalImage = finalCanvas.toDataURL("image/png");

alert("STRIP READY");
    document.getElementById("strip").style.display = "flex";
    document.getElementById("strip").innerHTML = `
        <img src="${photos[0]}" >
        <img src="${photos[1]}" >
        <img src="${photos[2]}" >
        <img src="${photos[3]}" >

        <div class="branding">PROMYS</div>
    `;

});
}
       
document.getElementById("countdown").style.display = "none";

}, 3000);

});

const video = document.getElementById("camera");
const filterButtons = document.querySelectorAll(".filter-btn");

const filters = {
    original: "none",
    y2k: "saturate(1.4) sepia(0.12) contrast(1.08) brightness(1.3)",
    pink: "saturate(1.3) sepia(0.08) hue-rotate(320deg) brightness(1.15)",
    black: "grayscale(1) contrast(1.15)"
};

let selectedFilter = "original";

filterButtons.forEach(button => {
    button.addEventListener("click", function() {
        selectedFilter = this.dataset.filter;

        video.style.filter = filters[selectedFilter];

document.querySelector(".camera-frame").classList.toggle(
    "y2k-grain",
    selectedFilter === "y2k"
);

        filterButtons.forEach(btn => btn.classList.remove("active"));
        this.classList.add("active");
    });
});
    
</script>
</body>
</html>
