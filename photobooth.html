<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHOTO BOOTH</title>

<style>
video{
    width:70vw;
    max-width:700px;
}
body{
    background:black;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
}

.page{
    display:flex;
    align-items:center;
    gap:80px;
    padding:90px 40px 40px 40px;
}

.logo{
    font-size:120px;
    font-weight:900;
    line-height:0.82;
    font-family:Arial,sans-serif;
}

.camera-section{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;

    margin-top:30px;

    position:relative;
}

.options{
    display:flex;
    flex-direction:column;
    gap:15px;
}

#strip{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.camera-frame{
    position:relative;
    display:inline-block;
}

button{
    margin-top:20px;
background:none;
border:1px solid white;
color:white;
padding:12px 24px;
font-family:Arial,sans-serif;
letter-spacing:2px;
cursor:pointer;
}

button:hover{
background:white;
color:black;
}

.camera-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

#countdown{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:120px;
    font-weight:900;
    color:white;
    display:none;
}

.flash{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:white;
    opacity:0;
    pointer-events:none;
}
    
</style>

</head>
<body>

<div class="page">

    <div class="logo">
        P<br>
        R<br>
        O<br>
        M<br>
        Y<br>
        S
    </div>

    <div class="camera-section">

    <div class="camera-frame">
        <video id="camera" autoplay playsinline></video>
        <div id="flash" class="flash"></div>
    </div>

    <button id="snap">TAKE PHOTO</button>

</div>

    <div class="options">
        <button>VERTICAL</button>
        <button>HORIZONTAL</button>

        <button>DOWNLOAD</button>
    </div>

</div>

<div id="countdown"></div>

<canvas id="photo" style="display:none;"></canvas>
<div id="strip"></div>
    
<script>
    
navigator.mediaDevices.getUserMedia({ video: true })
.then(function(stream) {
    document.getElementById("camera").srcObject = stream;
})
.catch(function(error) {
    console.log(error);
});

let photos = [];
    
document.getElementById("snap").addEventListener("click", function() {

    document.getElementById("countdown").style.display = "block";

    document.getElementById("countdown").textContent = "3";

    setTimeout(function() {
        document.getElementById("countdown").textContent = "2";
    }, 1000);

    setTimeout(function() {
        document.getElementById("countdown").textContent = "1";
    }, 2000);

   setTimeout(function() {

    document.getElementById("flash").style.opacity = "1";

    setTimeout(function() {
        document.getElementById("flash").style.opacity = "0";
    }, 150);

    const video = document.getElementById("camera");
const canvas = document.getElementById("photo");

canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

const context = canvas.getContext("2d");
context.drawImage(video, 0, 0);

photos.push(canvas.toDataURL("image/png"));

console.log("Photos taken:", photos.length);

if (photos.length < 4) {
    setTimeout(function() {
        document.getElementById("snap").click();
    }, 3000);
}

if (photos.length === 4) {

    document.getElementById("strip").innerHTML = `
        <img src="${photos[0]}" width="150">
        <img src="${photos[1]}" width="150">
        <img src="${photos[2]}" width="150">
        <img src="${photos[3]}" width="150">
    `;

}
       
document.getElementById("countdown").style.display = "none";

}, 3000);

});
    
</script>
</body>
</html>
