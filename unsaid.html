<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUESTION OF THE WEEK</title>

<style>

body{
    background:black;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
}

.page{
    display:flex;
    align-items:flex-start;
    gap:120px;
    padding:90px 40px;
}

.logo{
    text-decoration:none;
    color:white;
    font-size:120px;
    font-weight:900;
    line-height:0.82;
    transform:scaleX(1.3);
}

.content{
    max-width:700px;
}

.label{
    font-size:14px;
    letter-spacing:3px;
    margin-bottom:30px;
}

.question{
    font-size:48px;
    font-weight:900;
    margin-bottom:40px;
}

textarea{
    width:100%;
    height:150px;
    background:none;
    border:1px solid white;
    color:white;
    padding:20px;
    font-size:16px;
    resize:none;
    box-sizing:border-box;
}

button{
    margin-top:20px;
    background:none;
    border:1px solid white;
    color:white;
    padding:12px 24px;
    cursor:pointer;
}

button:hover{
    background:white;
    color:black;
}

.subtext{
    color:#888;
    font-size:14px;
    margin-top:12px;
    margin-bottom:20px
}
    
</style>
</head>

<body>

<div class="page">

<a href="/" class="logo">
P<br>
R<br>
O<br>
M<br>
Y<br>
S
</a>

<div class="content">

<div class="label">
QUESTION OF THE WEEK
</div>

<div class="question">
What are you afraid of losing?
</div>

<textarea
id="answer"
placeholder="Type your answer..."
></textarea>
<p class="subtext">
    Anonymous submissions. Reviewed before publishing.</p>

<button id="submit">
SUBMIT
</button>

</div>

</div>
    <script>
const SUPABASE_URL = "https://pqrkpoqjblmeuumislmm.supabase.co";
const SUPABASE_KEY = "sb_publishable_5cGSJMAF1nqCUG97Yuupeg_dY-Buf9k";

document.getElementById("submit").addEventListener("click", async () => {

    const answer = document.getElementById("answer").value;

    if (!answer.trim()) {
        alert("Please enter an answer");
        return;
    }

    const response = await fetch(
        `${SUPABASE_URL}/rest/v1/responses`,
        {
            method: "POST",
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`,
                "Content-Type": "application/json",
                "Prefer": "return=minimal"
            },
            body: JSON.stringify({
                answer: answer,
                approved: false
            })
        }
    );

    if (response.ok) {
        alert("Answer submitted");
        window.location.href = "/responses.html";
        
    } else {
        alert("Something went wrong");
        console.log(await response.text());
    }

});
</script>

</body>
</html>
