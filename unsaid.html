<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUESTION OF THE WEEK</title>

<style>

body{
    background:black;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
}

.page{
    display:flex;
    align-items:flex-start;
    gap:120px;
    padding:90px 40px;
}

.logo{
    text-decoration:none;
    color:white;
    font-size:120px;
    font-weight:900;
    line-height:0.82;
    transform:scaleX(1.3);
}

.content{
    max-width:700px;
}

.label{
    font-size:14px;
    letter-spacing:3px;
    margin-bottom:30px;
}

.question{
    font-size:48px;
    font-weight:900;
    margin-bottom:40px;
}

textarea{
    width:100%;
    height:150px;
    background:none;
    border:1px solid white;
    color:white;
    padding:20px;
    font-size:16px;
    resize:none;
    box-sizing:border-box;
}

button{
    margin-top:20px;
    background:none;
    border:1px solid white;
    color:white;
    padding:12px 24px;
    cursor:pointer;
}

button:hover{
    background:white;
    color:black;
}

.subtext{
    color:#888;
    font-size:14px;
    margin-top:12px;
    margin-bottom:20px
}
    
</style>
</head>

<body>

<div class="page">

<a href="/" class="logo">
P<br>
R<br>
O<br>
M<br>
Y<br>
S
</a>

<div class="content">

<div class="label">
QUESTION OF THE WEEK
</div>

<div class="question">
What are you afraid of losing?
</div>

<textarea
placeholder="Type your answer..."
></textarea>
<p class="subtext">
    Anonymous submissions. Reviewed before publishing.</p>

<button>
SUBMIT
</button>

</div>

</div>

</body>
</html>
