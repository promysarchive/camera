<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PROMYS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
    background:black;
    background-size:cover;
    background-position:center;
    color:white;
    font-family:Arial, sans-serif;
}

/* TOP BAR */
.topbar{
    height:65px;
    width:100%;
    padding:0 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,0.2);
}

.brand{
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:900;
    letter-spacing:2px;
}

.menu{
    display:flex;
    align-items:center;
    gap:28px;
    font-size:12px;
    letter-spacing:1.5px;
}

.menu a{
    color:white;
    text-decoration:none;
    transition:opacity 0.2s ease;
}

.menu a:hover{
    opacity:0.5;
}

/* KEEP THE ORIGINAL HOMEPAGE FEEL */
.logo{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:clamp(70px,12vw,150px);
    font-weight:900;
    line-height:0.82;
    font-family:Arial,sans-serif;
    letter-spacing:-8px;
    text-align:center;
}

@media(max-width:700px){
    .topbar{
        height:auto;
        min-height:65px;
        padding:18px;
        align-items:flex-start;
        gap:20px;
    }

    .menu{
        justify-content:flex-end;
        flex-wrap:wrap;
        gap:12px 16px;
        font-size:10px;
    }

    .logo{
        letter-spacing:-4px;
    }
}

</style>
</head>

<body>

<header class="topbar">
    <a href="index.html" class="brand">PROMYS</a>

    <nav class="menu">
        <a href="archive.html">001 / ARCHIVE</a>
        <a href="photobooth.html">002 / PHOTO BOOTH</a>
        <a href="#">003 / PROJECTS</a>
        <a href="unsaid.html">004 / UNSAID</a>
    </nav>
</header>

<div class="logo">PROMYS</div>

</body>
</html>
